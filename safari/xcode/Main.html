<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
</head>
<body>
    <main>
        <img src="../Icon.png" width="96" height="96" alt="">
        <h1 data-t="title"></h1>
        <p class="lead" data-t="lead"></p>

        <p class="status state-on" data-t="on"></p>
        <p class="status state-off" data-t="off"></p>

        <ol class="platform-ios">
            <li data-t="iosStep1"></li>
            <li data-t="iosStep2"></li>
            <li data-t="iosStep3"></li>
        </ol>
        <ol class="platform-mac">
            <li data-t="macStep1"></li>
            <li data-t="macStep2"></li>
        </ol>

        <button class="open-settings" data-t="open"></button>
    </main>
</body>
</html>
