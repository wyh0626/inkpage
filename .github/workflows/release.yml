# Push a tag like v1.2.0 and this:
#   1. builds the Chrome/Edge, Firefox and Safari packages at that version,
#   2. submits the new version to Firefox Add-ons, the Chrome Web Store and Edge Add-ons,
#   3. builds, signs and notarizes the Mac Safari app as a DMG,
#   4. uploads the iPhone / iPad app to App Store Connect (when IOS_APP_STORE is on),
#   5. publishes a GitHub Release with every package attached.
# A store whose secrets aren't set is skipped, so this works before every store is set up.
# Secrets: see docs/publishing.md#automatic-releases-from-github
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: version
        name: Take the version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version --no-git-tag-version --allow-same-version "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: node scripts/build.mjs
      - run: node scripts/check-i18n.mjs
      - name: Firefox validation (fails on errors, not warnings)
        run: npx --yes web-ext@8 lint --source-dir dist/firefox
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  firefox:
    needs: build
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Submit to Firefox Add-ons (listed, goes through review)
        if: env.AMO_JWT_ISSUER != ''
        run: >
          npx --yes web-ext@8 sign --source-dir dist/firefox --channel listed
          --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" --approval-timeout 0

  chrome:
    needs: build
    runs-on: ubuntu-latest
    env:
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Upload and publish to the Chrome Web Store (goes through review)
        if: env.CHROME_EXTENSION_ID != ''
        run: >
          npx --yes chrome-webstore-upload-cli@3 upload --auto-publish
          --source "dist/inkpage-chrome-${{ needs.build.outputs.version }}.zip"
          --extension-id "$CHROME_EXTENSION_ID" --client-id "$CHROME_CLIENT_ID"
          --client-secret "$CHROME_CLIENT_SECRET" --refresh-token "$CHROME_REFRESH_TOKEN"

  edge:
    needs: build
    runs-on: ubuntu-latest
    env:
      EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Submit to Edge Add-ons (goes through review)
        if: env.EDGE_PRODUCT_ID != ''
        uses: wdzeng/edge-addon@v2
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          zip-path: dist/inkpage-chrome-${{ needs.build.outputs.version }}.zip
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          api-key: ${{ secrets.EDGE_API_KEY }}

  safari:
    needs: build
    runs-on: macos-15
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
    steps:
      - uses: actions/checkout@v4
        if: env.MACOS_CERT_P12 != ''
      - name: Version from the tag
        if: env.MACOS_CERT_P12 != ''
        run: npm version --no-git-tag-version --allow-same-version "${{ needs.build.outputs.version }}"
      - name: Import the Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}
      - name: Notary credentials from an App Store Connect API key
        if: env.MACOS_CERT_P12 != ''
        run: |
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/asc.p8"
          xcrun notarytool store-credentials inkpage-ci --key "$RUNNER_TEMP/asc.p8" \
            --key-id "${{ secrets.ASC_KEY_ID }}" --issuer "${{ secrets.ASC_ISSUER_ID }}"
      - name: Build, sign and notarize the Mac Safari app
        if: env.MACOS_CERT_P12 != ''
        run: INKPAGE_NOTARY_PROFILE=inkpage-ci sh scripts/build-safari-app.sh
      - uses: actions/upload-artifact@v4
        if: env.MACOS_CERT_P12 != ''
        with:
          name: safari
          path: dist/InkPage-*.dmg

  ios:
    needs: build
    # Opt in with the repository variable IOS_APP_STORE=true once the app exists in App Store Connect.
    if: vars.IOS_APP_STORE == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Version from the tag
        run: npm version --no-git-tag-version --allow-same-version "${{ needs.build.outputs.version }}"
      - name: Archive the iPhone / iPad app and upload it to App Store Connect (the run number is the build number)
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > "$KEY"
          INKPAGE_BUILD=${{ github.run_number }} sh scripts/ios-upload.sh -authenticationKeyPath "$KEY" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

  release:
    needs: [build, safari]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: InkPage ${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/dist/*.zip
            artifacts/safari/*.dmg
